<div class="modal-overlay">
    <div class="modal-header modal-danger">
        <h3 class="modal-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="modal-icon">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            Delete {{ itemType }}
        </h3>
        <button type="button" class="btn-close" (click)="cancelDelete()" [disabled]="isDeleting"
            aria-label="Close"></button>
    </div>

    <div class="modal-body">
        <p class="delete-message">
            Are you sure you want to delete <strong>{{ itemName }}</strong>?
        </p>
        <p class="delete-note">
            This action will mark the {{ itemType | lowercase }} as deleted, but your data will be safely archived
            and can be recovered if needed.
        </p>
    </div>

    <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cancelDelete()" [disabled]="isDeleting">
            Keep {{ itemType }}
        </button>
        <button class="btn btn-danger" (click)="confirmDelete()" [disabled]="isDeleting">
            <span *ngIf="!isDeleting">Delete {{ itemType }}</span>
            <span *ngIf="isDeleting">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Deleting...
            </span>
        </button>
    </div>
</div>
