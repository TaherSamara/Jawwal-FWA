<div class="ping-container">
    <!-- Ping Input Form -->
    <div class="ping-form">
        <div class="form-group">
            <label for="hostInput" class="form-label">Host or IP Address</label>
            <input type="text" id="hostInput" class="form-control" [(ngModel)]="host"
                placeholder="e.g., 8.8.8.8 or google.com" (keyup.enter)="executePing()" />
        </div>

        <button class="btn btn-ping" (click)="executePing()" [disabled]="isLoading">
            <svg *ngIf="!isLoading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.94 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            {{ isLoading ? 'Pinging...' : 'Ping' }}
        </button>
    </div>
</div>

<!-- Ping Modal -->
<ng-template #pingModal let-modal="modal">
    <div class="modal-header">
        <h5 class="modal-title">Ping Results</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
    </div>

    <div class="modal-body">
        <!-- Loading State -->
        <div *ngIf="isLoading" class="loading-state">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Pinging {{ host }}...</p>
        </div>

        <!-- Error State -->
        <div *ngIf="error && !isLoading" class="alert alert-danger" role="alert">
            <strong>Error:</strong>
            <p class="mb-0">{{ error }}</p>
        </div>

        <!-- Success State -->
        <div *ngIf="pingResult && !isLoading && !error" class="ping-result">
            <div class="result-header">
                <h6>Host: <span class="host-name">{{ pingResult.host }}</span></h6>
            </div>

            <div class="result-output">
                <h6>Ping Output:</h6>
                <pre class="output-box">{{ pingResult.raw_output }}</pre>
            </div>
        </div>

        <!-- Result with error from server -->
        <div *ngIf="pingResult && !isLoading && error" class="ping-result">
            <div class="result-header">
                <h6>Host: <span class="host-name">{{ pingResult.host }}</span></h6>
            </div>

            <div class="alert alert-danger" role="alert">
                <strong>Error:</strong>
                <p class="mb-0">{{ error }}</p>
            </div>

            <div class="result-output" *ngIf="pingResult.raw_output">
                <h6>Ping Output:</h6>
                <pre class="output-box">{{ pingResult.raw_output }}</pre>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Close</button>
        <button type="button" class="btn btn-primary" (click)="resetForm(); modal.dismiss()">
            Ping Again
        </button>
    </div>
</ng-template>
