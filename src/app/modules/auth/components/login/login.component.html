<div class="auth-card">
  <div class="logo-section text-center mb-4">
    <img src="assets/img/logo.svg" alt="Jawwal Logo" class="logo-image">
  </div>

  <div class="brand-section text-center mb-4">
    <h1 class="brand-title">Jawwal</h1>
    <p class="brand-subtitle">Station Management System</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="submit()" class="auth-form">
    <div *ngIf="message" [ngClass]="messageType === 'danger' ? 'alert-error' : 'alert-success'"
      class="alert-message mb-3">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="me-2">
        <path *ngIf="messageType === 'danger'"
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z">
        </path>
        <path *ngIf="messageType !== 'danger'" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      </svg>
      {{ message }}
    </div>

    <div class="form-group mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email address" formControlName="email"
        autocomplete="email" inputmode="email" required>
    </div>

    <div class="form-group mb-4">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Enter your password"
        formControlName="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-login w-100" [disabled]="isLoginLoading">
      <span *ngIf="!isLoginLoading" class="btn-text d-flex align-items-center justify-content-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="me-2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Sign In
      </span>
      <span *ngIf="isLoginLoading" class="btn-loading d-flex align-items-center justify-content-center">
        <span class="spinner-mini me-2"></span>
        Processing...
      </span>
    </button>
  </form>

  <div class="auth-footer text-center mt-4">
    <p class="footer-text small text-muted">All rights reserved © Jawwal</p>
  </div>
</div>
