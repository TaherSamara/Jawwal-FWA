<div class="auth-card">
  <div class="logo-section text-center mb-4">
    <img src="assets/img/logo.svg" alt="Jawwal Logo" class="logo-image">
  </div>

  <div class="brand-section text-center mb-4">
    <h1 class="brand-title">Change Password</h1>
    <p class="brand-subtitle">Update your password securely</p>
  </div>

  <form [formGroup]="changePasswordForm" (ngSubmit)="submit()" class="auth-form">
    <div *ngIf="message" [ngClass]="messageType === 'danger' ? 'alert-error' : 'alert-success'"
      class="alert-message mb-3">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="me-2">
        <path *ngIf="messageType === 'danger'"
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z">
        </path>
        <path *ngIf="messageType !== 'danger'" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      </svg>
      {{ message }}
    </div>

    <div class="form-group mb-3">
      <label for="currentPassword" class="form-label">Current Password</label>
      <input type="password" class="form-control" id="currentPassword" placeholder="Enter your current password"
        formControlName="currentPassword" autocomplete="current-password" required>
    </div>

    <div class="form-group mb-3">
      <label for="newPassword" class="form-label">New Password</label>
      <input type="password" class="form-control" id="newPassword" placeholder="Enter your new password"
        formControlName="newPassword" autocomplete="new-password" required>
      <small class="text-muted" *ngIf="f.newPassword.touched && f.newPassword.errors?.minlength">
        Password must be at least 6 characters
      </small>
    </div>

    <div class="form-group mb-4">
      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your new password"
        formControlName="confirmPassword" autocomplete="new-password" required>
      <small class="text-danger" *ngIf="changePasswordForm.hasError('passwordMismatch') && f.confirmPassword.touched">
        Passwords do not match
      </small>
    </div>

    <button type="submit" class="btn-login w-100" [disabled]="isLoading || changePasswordForm.invalid">
      <span *ngIf="!isLoading" class="btn-text d-flex align-items-center justify-content-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="me-2">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
          <path d="M10 17l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" fill="currentColor"></path>
        </svg>
        Change Password
      </span>
      <span *ngIf="isLoading" class="btn-loading d-flex align-items-center justify-content-center">
        <span class="spinner-mini me-2"></span>
        Processing...
      </span>
    </button>
  </form>
</div>
